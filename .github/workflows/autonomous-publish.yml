name: Autonomous Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "11 9 * * *"
    - cron: "41 12 * * 1"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: preflight
        run: python scripts/preflight.py
      - if: steps.preflight.outputs.halted != 'true'
        run: python scripts/build.py --out site
      - if: steps.preflight.outputs.halted != 'true'
        run: python scripts/validate.py --dist site
      - if: steps.preflight.outputs.halted != 'true'
        run: python -m unittest discover -s tests
      - if: steps.preflight.outputs.halted != 'true'
        uses: actions/configure-pages@v5
      - if: steps.preflight.outputs.halted != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.preflight.outputs.halted != 'true'
        uses: actions/deploy-pages@v4

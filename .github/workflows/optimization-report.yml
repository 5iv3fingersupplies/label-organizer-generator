name: Optimization Report
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 15 * * 2"
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: preflight
        run: python scripts/preflight.py
      - if: steps.preflight.outputs.halted != 'true'
        run: python scripts/build.py --out site
      - if: steps.preflight.outputs.halted != 'true'
        run: python scripts/validate.py --dist site
      - if: steps.preflight.outputs.halted != 'true'
        run: python scripts/optimize.py --out reports
      - if: steps.preflight.outputs.halted != 'true'
        run: cat reports/optimization-report.md >> "$GITHUB_STEP_SUMMARY"
